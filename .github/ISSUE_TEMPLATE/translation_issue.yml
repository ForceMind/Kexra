name: "🌐 中文化与术语反馈"
description: "反馈 Kexra 简体中文界面、文档或用户可见输出的问题"
title: "[i18n] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        默认语言为简体中文。技术原文、代码、命令、证据及历史检测规则不应为了翻译而修改。
        详细规则见 docs/LOCALIZATION.zh-CN.md。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - "中文翻译错误 / 术语不统一"
        - "可见界面仍出现旧韩语"
        - "错误提示或通知未翻译"
        - "不应翻译的技术原文被改写"
        - "文档/链接存在过时品牌"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 当前文案与出现位置
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: 建议的修改方式
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: 翻译键 / 文件路径
      placeholder: "例如：web/messages/zh.json → dashboard.title"
    validations:
      required: false
