name: "🐛 缺陷反馈"
description: "反馈 Kexra 的可复现功能缺陷（安全漏洞请走私密报告渠道）"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请在提交前搜索相似问题。Kexra 仍处于品牌迁移阶段。
        安全漏洞请查看 SECURITY.md；不要公开真实密钥、客户流量或测试目标。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 和 PR。
          required: true
        - label: 复现没有超出自有或明确授权的隔离测试范围。
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与预期行为
      placeholder: "预期……，实际……"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开页面……
        2. 选择……
        3. 观察错误……
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或提交
      placeholder: "main / feat/kexra-independent-brand / 完整 commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - "Web 前端 / 中文文案"
        - "Go 后端 / API"
        - "Agent / 模型 / 工具"
        - "配置 / 数据库"
        - "Docker / 发布 / 自动更新"
        - "文档 / CI"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或最小示例（请脱敏）
      description: "不要上传令牌、密码、真实资产信息或未经授权的证据"
    validations:
      required: false
