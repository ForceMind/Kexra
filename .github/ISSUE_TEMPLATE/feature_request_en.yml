name: "✨ Feature request (English)"
description: "Propose a feature or UX improvement for Kexra"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and authorized use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Alternatives and compatibility impact
    validations:
      required: false
  - type: checkboxes
    id: authorization
    attributes:
      label: Scope
      options:
        - label: This proposal does not require unauthorized activity or removal of third-party license notices.
          required: true
