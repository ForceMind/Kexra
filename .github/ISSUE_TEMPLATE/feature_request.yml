name: "✨ 功能建议"
description: "提出改进 Kexra 功能、体验或开发工具的建议"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 用户需求与场景
      description: "明确适用范围，不要包含未经授权的安全测试需求"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: "说明交互、数据模型、验收方式与兼容性影响"
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 约束
      options:
        - label: 建议符合授权使用和第三方许可要求。
          required: true
