name: "🐛 Bug report (English)"
description: "Report a reproducible Kexra defect (security vulnerabilities belong in private reports)"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. Do not disclose secrets, client data or exploit details.
        For Kexra software vulnerabilities, follow SECURITY.md privately.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: Reproduction stayed within systems I own or am explicitly authorized to test.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Branch / version / commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
    validations:
      required: false
