name: "🌐 Localization issue (English)"
description: "Report Chinese UI copy, terminology or translation problems in Kexra"
title: "[i18n] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Kexra defaults to Simplified Chinese. Commands, logs, evidence,
        protocol names, and historic detection signatures must remain unaltered.
  - type: textarea
    id: current
    attributes:
      label: Current text and location
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested wording
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: Message key or file path
    validations:
      required: false
