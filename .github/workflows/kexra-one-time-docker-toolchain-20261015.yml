name: Kexra One-Time Docker Toolchain Verification
on:
  push:
    branches:
      - verify/kexra-docker-toolchain-20261015
permissions:
  contents: read
jobs:
  docker-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: one-time-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - name: Static Docker pin and documentation checks
        run: |
          python3 -I scripts/check-docker-toolchain.py
          python3 -I scripts/check-kexra-migration.py
          python3 -I scripts/check-doc-links.py
          docker compose config >/dev/null
      - name: Build embedded backend locally
        run: |
          cd web
          npm ci --no-audit
          npm run build:static
          cd ..
          mkdir -p server/webui/dist dist/amd64
          cp -a web/out/. server/webui/dist/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedui -o dist/amd64/kexra ./cmd/kexra
          dist/amd64/kexra -h
      - name: Build Docker runtime image (not published)
        run: docker build --build-arg TARGETARCH=amd64 -t kexra:toolchain-verify .
      - name: Confirm pinned tools and offline Chromium startup
        run: |
          docker run --rm --network none --entrypoint /bin/sh kexra:toolchain-verify -ec '
            node --version
            npm --version
            npm ls -g --depth=0 @playwright/mcp@0.0.83 @playwright/cli@0.1.22 playwright@1.64.1
            playwright-cli --help >/dev/null
            playwright-mcp --help >/dev/null
            node -e '\''const {chromium}=require("/usr/local/lib/node_modules/playwright"); (async()=>{ const browser=await chromium.launch({headless:true,args:["--no-sandbox"]}); const page=await browser.newPage(); await page.goto("about:blank"); await browser.close(); })().catch(e=>{console.error(e);process.exit(1)})'\''
          '
      - name: Inspect image, avoid publishing
        run: |
          docker image inspect kexra:toolchain-verify --format '{{.Id}}'
          echo "Local test image only; no registry push, no release tag, no public service exposure."
