name: Kexra One-Time Native Update Lifecycle
on:
  push:
    branches: ["verify/kexra-native-update-20261019"]
    paths: [".github/workflows/kexra-native-update-once.yml"]
permissions:
  contents: read
concurrency:
  group: kexra-native-update-20261019
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c7d48de899c5adfd1f0d31f3a6567bb02f4efc9
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Exact source and static checks
        run: |
          test "$(git rev-parse HEAD)" = 6c7d48de899c5adfd1f0d31f3a6567bb02f4efc9
          git diff --check
          test -z "$(gofmt -l selfupdate)"
          python3 -I scripts/check-kexra-migration.py
          python3 -I scripts/check-docker-toolchain.py
          python3 -I scripts/check-web-vendor.py
          python3 -I scripts/check-doc-links.py
      - name: Full Go quality gate and isolated native subprocess tests
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
          go test -race ./selfupdate -count=1
          go test ./selfupdate -run 'TestNativeBootstrapLifecycle|TestSimulatedReleaseUpdateLifecycle' -count=1 -v
      - name: Cross-platform source compilation (not package or runtime acceptance)
        run: |
          output="$(mktemp -d)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            echo "Compile $target"
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -o "$output/kexra-$target_os-$target_arch" ./cmd/kexra
          done
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c7d48de899c5adfd1f0d31f3a6567bb02f4efc9
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Native executable replacement, rollback and metadata tests
        run: |
          go test ./selfupdate -count=1 -v
          go vet ./selfupdate
