name: One-time import of the verified Artex archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-local-archive.yml"

permissions:
  contents: write

jobs:
  import-verified-snapshot:
    if: github.repository == 'ForceMind/Artex'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original snapshot without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=0fdecdc56750
          SOURCE_TREE=826785de7ffd3c042d6832bcb332fef8f0239337
          SOURCE_URL=https://github.com/jiwoochris/artex-ko.git
          tempdir=$(mktemp -d)
          trap 'rm -rf "$tempdir"' EXIT
          git clone --quiet --depth 30 "$SOURCE_URL" "$tempdir/source"
          git -C "$tempdir/source" checkout --quiet --detach "$SOURCE_SHA"
          actual_tree=$(git -C "$tempdir/source" rev-parse HEAD^{tree})
          test "$actual_tree" = "$SOURCE_TREE"
          for workflow in "$tempdir/source"/.github/workflows/*.yml; do
            cmp --silent "$workflow" ".github/workflows/$(basename "$workflow")"
          done
          rsync -a --exclude='.git' --exclude='.github/workflows/' "$tempdir/source/" ./
          git add -A -- . ':(exclude).github/workflows'
          cp .git/index "$tempdir/check.index"
          GIT_INDEX_FILE="$tempdir/check.index" git rm -q --cached .github/workflows/import-local-archive.yml
          actual_import_tree=$(GIT_INDEX_FILE="$tempdir/check.index" git write-tree)
          test "$actual_import_tree" = "$SOURCE_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import verified local Artex snapshot (0fdecdc)"
          git push origin HEAD:main
