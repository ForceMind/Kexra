name: web
# 简体中文版前端验证：检查静态导出、页面中文默认配置和 Biome 代码质量。
# Temporary cost-control: dispatch by hand only; no push/PR/schedule/tag automation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: 中文静态导出（含 TypeScript 检查）
        env:
          NEXT_PUBLIC_LOCALE: zh
        run: npm run build:static
      - name: 简体中文默认页面与可见韩语残留检查
        run: python3 -I ../scripts/check-web-zh.py
      - name: 中韩本地化键集一致性
        run: python3 -I ../scripts/check-i18n-keys.py
      - name: Biome lint/format/a11y
        if: always()
        run: npm run check -- --diagnostic-level=error --max-diagnostics=100
