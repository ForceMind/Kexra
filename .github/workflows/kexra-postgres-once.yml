name: Kexra One-Time PostgreSQL Integration
on:
  push:
    branches: ["verify/kexra-postgres-20261019"]
    paths: [".github/workflows/kexra-postgres-once.yml"]
permissions:
  contents: read
jobs:
  isolated-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: isolated-ci-only-20261019
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 833b67f8dfda66bb94b134008882bbf5434211bd
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Six packages, each with a fresh isolated database
        env:
          PGPASSWORD: isolated-ci-only-20261019
        run: |
          mkdir -p /tmp/kexra-pg-results
          for pkg in agent config db evidence llmrec server; do
            database="kexra_ci_$pkg"
            psql -h 127.0.0.1 -U artex -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database;"
            ARTEX_PG_DSN="postgres://artex:isolated-ci-only-20261019@127.0.0.1:5432/$database?sslmode=disable" go test "./$pkg/" -json -count=1 > "/tmp/kexra-pg-results/$pkg.jsonl"
            python3 -c 'import json,sys; events=[json.loads(x) for x in open(sys.argv[1])]; print(sys.argv[1], {a:sum(e.get("Action")==a and "Test" in e for e in events) for a in ("pass","fail","skip")}); [print("SKIP:",e.get("Test"),e.get("Output","")) for e in events if e.get("Action")=="skip"]' "/tmp/kexra-pg-results/$pkg.jsonl"
          done
      - name: Report failed test output
        if: failure()
        run: |
          for path in /tmp/kexra-pg-results/*.jsonl; do
            if [ -f "$path" ]; then tail -n 80 "$path"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-six-package-results
          path: /tmp/kexra-pg-results/*.jsonl
          retention-days: 14
