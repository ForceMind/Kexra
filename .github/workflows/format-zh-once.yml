name: One-time Chinese source format
on:
  push:
    branches: [feat/zh-cn-default-and-output]
    paths:
      - .github/workflows/format-zh-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ForceMind/Artex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install formatter
        working-directory: web
        run: npm ci
      - name: Format only translated sources (no behavior change)
        working-directory: web
        run: npx biome format --write src/lib/mock/data.ts src/lib/mock/handler.ts 'src/app/(main)/function/tasks/page.tsx'
      - name: Check formatter + lint gate
        working-directory: web
        run: npm run check -- --diagnostic-level=error --max-diagnostics=100
      - name: Commit formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'web/src/lib/mock/data.ts' 'web/src/lib/mock/handler.ts' 'web/src/app/(main)/function/tasks/page.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'style(web): format translated Chinese mock and task sources'
            git push origin HEAD:feat/zh-cn-default-and-output
          fi
