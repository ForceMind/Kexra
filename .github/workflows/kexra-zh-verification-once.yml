name: Kexra One-Time zh-CN Go Verification
on:
  push:
    branches:
      - verify/kexra-zh-go-20261014
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Kexra import and packaging references
        run: python3 -I scripts/check-kexra-migration.py
      - name: Go build
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Go tests (no external targets)
        run: go test ./... -count=1
