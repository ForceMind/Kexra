name: One-time Kexra product migration
on:
  push:
    branches: [feat/kexra-independent-brand]
    paths:
      - ".github/workflows/kexra-migrate-once.yml"
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'ForceMind/Artex'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply scoped brand migration
        run: python3 -I scripts/rebrand_kexra.py
      - name: Format Go entrypoint and authentication code
        run: gofmt -w cmd/kexra/main.go server/auth.go
      - name: Format frontend changed source
        working-directory: web
        run: |
          npm ci
          npx biome format --write src/config/app-config.ts src/proxy.ts src/lib/auth.ts src/lib/api.ts src/hooks/use-current-user.ts 'src/app/(main)/_components/sidebar/app-sidebar.tsx' 'src/app/(auth)/login/page.tsx' 'src/app/(auth)/setup/page.tsx'
      - name: Go compile check
        run: go build ./...
      - name: Frontend type check and static build
        working-directory: web
        env:
          NEXT_PUBLIC_LOCALE: zh
        run: npm run build:static
      - name: Commit independent project changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(brand): rebrand application, CLI, Go module and assets as Kexra"
            git push origin HEAD:feat/kexra-independent-brand
          fi
