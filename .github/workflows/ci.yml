name: ci
# Go and PostgreSQL regression checks, with an optional Web and Docker acceptance job.
# Temporary cost-control: dispatch by hand only; no push/PR/schedule/tag automation.
on:
  workflow_dispatch:
    inputs:
      image_audit:
        description: Run Web validation and the Linux amd64 Docker image audit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 빌드·정적 분석·테스트를 데이터베이스 없이 돌린다. 기여자가 저장소를 clone 한 뒤
  # PostgreSQL 없이 `go test ./...` 를 돌리는 환경을 그대로 재현한다. 데이터베이스가
  # 있어야 하는 통합 테스트는 이 환경에서 t.Skipf 로 건너뛰므로(스킵은 통과로 집계된다),
  # 빌드·go vet·DB 를 쓰지 않는 단위 테스트가 전부 green 이어야 한다. 이 조합만으로도
  # 패키지 경계를 넘나드는 회귀(예: 한 패키지의 문구를 바꾸면서 다른 패키지의 테스트
  # 단언을 깨뜨리는 경우)를 머지 전에 잡을 수 있다.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Docker dependency and audit regression checks (no image build)
        run: |
          python3 -I scripts/check-docker-toolchain.py
          python3 -I scripts/test-image-audit.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (DB 없음 — 통합 테스트는 스킵)
        run: go test ./... -count=1
      - name: Module integrity, migration and documentation checks
        run: |
          go mod verify
          python3 -I scripts/check-kexra-migration.py
          python3 -I scripts/check-doc-links.py

  # 실제 PostgreSQL 이 있어야 도는 DB 통합 테스트(알림·증거·사용량 계량 등)를 맡는다.
  # 위 go job 이 스킵하는 경로(알림 채널 검증, 증거 저장, llm_usage 계량 등)를 실제
  # 데이터베이스로 강제해, DB 통합 경로에서만 드러나는 한국어화 회귀까지 머지 전에 잡는다.
  #
  # 상류의 테스트 하네스는 모든 패키지가 하나의 데이터베이스를 공유하고, 테이블을 한 번만
  # 만들어 재사용하며, 패키지 실행 순서와 누적 데이터에 암묵적으로 의존하도록 설계되어
  # 있어, 하나의 데이터베이스에 전체를 몰아 돌리면 서로 다른 방식으로 깨진다(누적 데이터
  # 오염, 커넥션 teardown 경쟁, 리셋 시 교차 패키지 스키마 의존). 그래서 여기서는 패키지마다
  # 자체 PostgreSQL 서비스를 띄워 "빈 데이터베이스 + 단일 패키지" 로 격리 실행한다. 각
  # 패키지가 독립 job(matrix) 으로 돌아 서로의 데이터·커넥션·스키마에 닿지 않으므로 그 세
  # 상충이 구조적으로 사라진다. db.Open 이 스키마를 자동 마이그레이션하며, llm_usage 처럼
  # db.Open 이 만들지 않는 테이블은 각 테스트가 EnsureLLMUsageTable 로 스스로 보장한다.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: go test (DB 통합 · ${{ matrix.pkg }} 패키지 격리)
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  web-image-audit:
    if: inputs.image_audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: Record candidate SHA and pinned build inputs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          mkdir -p image-audit
          git rev-parse HEAD > image-audit/source-sha.txt
          sed -n '/^FROM /p' Dockerfile > image-audit/base-images.txt
          sha256sum Dockerfile docker/debian.sources docker/npm-runtime.json docker/browser-tools/package-lock.json web/package-lock.json go.sum > image-audit/source-inputs.sha256
      - name: Build Chinese Web UI
        working-directory: web
        env:
          NEXT_PUBLIC_LOCALE: zh
        run: |
          npm ci
          npm run build:static
      - name: Web static regression checks
        run: |
          python3 -I scripts/check-web-vendor.py
          python3 -I scripts/check-i18n-keys.py
          python3 -I scripts/check-web-zh.py
          npm --prefix web run check -- --diagnostic-level=error --max-diagnostics=100
      - name: Build embedded Linux binary and local image
        run: |
          mkdir -p server/webui/dist dist/amd64
          cp -a web/out/. server/webui/dist/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedui -o dist/amd64/kexra ./cmd/kexra
          dist/amd64/kexra -h
          docker build --build-arg TARGETARCH=amd64 -t kexra:local .
          test "$(docker image inspect kexra:local --format '{{.Architecture}}')" = amd64
          docker image inspect kexra:local > image-audit/image-inspect.json
          docker image inspect kexra:local --format '{{.Id}}' > image-audit/image-id.txt
      - name: Offline browser MCP smoke test
        id: mcp
        continue-on-error: true
        run: python3 -I scripts/smoke-docker-mcp.py --image kexra:local
      - name: Browser dependency lockfile audit
        id: browser-lock
        continue-on-error: true
        run: npm audit --prefix docker/browser-tools --package-lock-only --ignore-scripts --json > image-audit/browser-tools-npm-audit.json
      - name: Install hash-verified Trivy 0.76.0
        env:
          TRIVY_ARCHIVE_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          curl --fail --location --retry 2 --output /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" /tmp/trivy.tgz | sha256sum -c -
          mkdir /tmp/kexra-trivy
          tar -xzf /tmp/trivy.tgz -C /tmp/kexra-trivy trivy
          /tmp/kexra-trivy/trivy --version
      - name: Scan image and generate SPDX SBOM (inventory, no suppression)
        run: |
          /tmp/kexra-trivy/trivy image --image-src docker --timeout 10m --scanners vuln,license --list-all-pkgs --format json --output image-audit/trivy-image.json kexra:local
          /tmp/kexra-trivy/trivy image --image-src docker --timeout 10m --format spdx-json --output image-audit/image.spdx.json kexra:local
          /tmp/kexra-trivy/trivy --version > image-audit/scanner-database.txt
      - name: Enforce image audit and smoke test outcomes
        id: audit
        continue-on-error: true
        env:
          MCP_OUTCOME: ${{ steps.mcp.outcome }}
          BROWSER_LOCK_OUTCOME: ${{ steps.browser-lock.outcome }}
        run: |
          test "$(docker image inspect kexra:local --format '{{.Id}}')" = "$(cat image-audit/image-id.txt)"
          python3 -I scripts/check-image-audit.py image-audit/trivy-image.json image-audit/image.spdx.json --summary image-audit/summary.json
          test "$MCP_OUTCOME" = success
          test "$BROWSER_LOCK_OUTCOME" = success
      - name: Record runtime, browser binaries and license inventory
        run: |
          docker run --rm --network none --entrypoint sh kexra:local -c 'node --version; npm --version; python --version; dpkg-query -W' > image-audit/runtime-dpkg.txt
          docker run --rm --network none --entrypoint npm kexra:local sbom --prefix /opt/kexra-browser-tools --omit=dev --sbom-format cyclonedx > image-audit/browser-tools.cdx.json
          docker run --rm --network none --entrypoint sh kexra:local -c 'find /root/.cache/ms-playwright -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) -exec sh -c '\''"$1" --version; sha256sum "$1"'\'' sh {} \;' > image-audit/browser-binaries.txt
          test -s image-audit/browser-binaries.txt
          docker run --rm --network none --entrypoint tar kexra:local -czf - /usr/share/doc /usr/local/lib/node_modules/npm/LICENSE /usr/local/lib/python3.12/LICENSE.txt > image-audit/installed-license-docs.tar.gz
      - name: Hash collected evidence
        if: always()
        run: |
          if [ -d image-audit ]; then
            cd image-audit
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexra-image-audit-amd64
          path: image-audit/
          retention-days: 14
      - name: Require the image audit gate to pass
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: test "$AUDIT_OUTCOME" = success
